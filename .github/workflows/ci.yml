name: CI Pipeline & Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run Python Tests & Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8 (Syntax errors & undefined names)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Full Automated Self-Test Suite (23 Tests)
        run: |
          python Main.py --sqlite --test

      - name: Verify Automated Headless ELT Pipeline
        run: |
          python Main.py --sqlite --pipeline

      - name: Verify 12 Publication Charts Generator
        run: |
          python Main.py --sqlite --visualize
